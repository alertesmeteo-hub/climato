name: Mise à jour Climatologie France

on:
  workflow_dispatch:
  schedule:
    # Une fois par jour : les données quotidiennes Météo-France des deux
    # dernières années sont republiées chaque jour côté data.gouv.fr.
    - cron: "15 7 * * *"

permissions:
  contents: write

concurrency:
  group: update-climato-france
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Historique complet (~1,5 Go de CSV compressés, plusieurs dizaines de
    # millions de relevés à fusionner sur 95 départements) : nettement plus
    # long qu'une mise à jour cep/gfs, d'où la marge généreuse.
    timeout-minutes: 180

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Produire la climatologie mensuelle
        id: build
        run: |
          python scripts/update_climato_france.py \
            --output-dir build/national \
            --current-metadata-url \
            "https://raw.githubusercontent.com/${{ github.repository }}/data/index.json"
          if test -f build/national/index.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Rien de nouveau à publier."
          fi

      - name: Vérifier la publication
        if: steps.build.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/national")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          stations = json.loads((root / "stations.json").read_text(encoding="utf-8"))
          departements = json.loads((root / "departements.json").read_text(encoding="utf-8"))

          assert index["status"] == "ok"
          assert index["source"]["provider"] == "Météo-France"
          assert index["pipeline_version"]
          assert index["coverage"]["stations"] == len(stations["stations"])
          assert index["coverage"]["stations"] > 0
          assert len(departements) >= 90

          sample = stations["stations"][0]
          assert sample["years"], f"aucune année pour la station échantillon {sample['num_poste']}"
          sample_year = sample["years"][-1]
          sample_path = root / "stations" / sample["num_poste"] / f"{sample_year}.json"
          assert sample_path.is_file(), f"fichier année manquant : {sample_path}"
          sample_data = json.loads(sample_path.read_text(encoding="utf-8"))
          assert sample_data["days"], "série de jours vide pour la station/année échantillon"

          print(
              f"Validation OK : {index['coverage']['stations']} stations, "
              f"{index['coverage']['departments']} départements, "
              f"période {index['period']['first_date']} → {index['period']['last_date']}"
          )
          PY

      - name: Publier la branche data
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -a build/national/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Données climatologie $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git push --force origin data
