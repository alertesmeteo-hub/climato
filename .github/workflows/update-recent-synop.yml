name: Complément récent SYNOP

on:
  workflow_dispatch:
  schedule:
    - cron: "45 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-climato-france
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Récupérer les données publiées
        uses: actions/checkout@v7
        with:
          ref: data
          path: published-data

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compléter les derniers jours
        run: python scripts/update_recent_synop.py --data-dir published-data

      - name: Publier si nécessaire
        working-directory: published-data
        run: |
          if git diff --quiet; then
            echo "Aucune donnée nouvelle."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Complément SYNOP $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:data


