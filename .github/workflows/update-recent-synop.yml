name: Complément récent SYNOP

on:
  workflow_dispatch:
  schedule:
    - cron: "45 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-climato-france
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Récupérer les données publiées
        uses: actions/checkout@v7
        with:
          ref: data
          path: published-data

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compléter les derniers jours
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_recent_synop.py --data-dir published-data 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Publier si nécessaire
        working-directory: published-data
        run: |
          if git diff --quiet; then
            echo "Aucune donnée nouvelle."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Complément SYNOP $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:data


